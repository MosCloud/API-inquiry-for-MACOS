name: Release verification

# Runs only for release tags. Day-to-day changes rely on the local test runner
# (`swift run APIInquiryCoreTestsRunner`, ~3s); the macOS runners queue for hours,
# which cost far more than the check is worth on every push.
on:
  push:
    tags:
      - "release/*"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify (tests + app build)
        run: Scripts/verify.sh
